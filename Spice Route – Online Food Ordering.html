<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spice Route – Order Food Online</title>
<style>
:root{--bg:#fbf6ef;--surface:#fff;--text:#2a211b;--muted:#7a6c60;--accent:#d9480f;--accent-t:#fff;--border:#eadfd2;--chip:#f3e8da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--surface:#262019;--text:#f3ebe2;--muted:#a89a8c;--accent:#ff7a3d;--accent-t:#1a1511;--border:#3a3027;--chip:#332a21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1511;--surface:#262019;--text:#f3ebe2;--muted:#a89a8c;--accent:#ff7a3d;--accent-t:#1a1511;--border:#3a3027;--chip:#332a21;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif}
h1,h2,h3,button,.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:28px 20px 12px;max-width:1100px;margin:0 auto}
header h1{margin:0;font-size:2rem;letter-spacing:-.5px}
header p{margin:4px 0 0;color:var(--muted)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 40px;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.chip{border:1px solid var(--border);background:var(--chip);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.emoji{font-size:2.6rem;line-height:1}
.card h3{margin:4px 0 0;font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.88rem;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{font-weight:700}
button{font-size:.9rem;cursor:pointer}
.add{background:var(--accent);color:var(--accent-t);border:0;padding:8px 14px;border-radius:8px;font-weight:600}
.add:active{transform:scale(.96)}
aside{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;position:sticky;top:12px}
aside h2{margin:0 0 12px;font-size:1.2rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.item small{color:var(--muted);display:block}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--chip);color:var(--text);padding:0}
.rm{background:none;border:0;color:var(--muted);font-size:.8rem;padding:0}
.sum{margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.sum .total{color:var(--text);font-weight:700;font-size:1.15rem;border-top:1px solid var(--border);margin-top:6px;padding-top:10px}
.checkout{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-weight:700;font-size:1rem}
.checkout:disabled{opacity:.4;cursor:not-allowed}
.ok{margin-top:12px;padding:10px;border-radius:8px;background:var(--chip);text-align:center}
</style>
</head>
<body>
<header>
<h1>🍛 Spice Route</h1>
<p>Fresh, hot and delivered to your door.</p>
</header>
<div class="wrap">
<main>
<div class="chips" id="chips"></div>
<div class="grid" id="menu"></div>
</main>
<aside>
<h2>Your cart (<span id="count">0</span>)</h2>
<div id="cart"></div>
<div class="sum sans" id="sum"></div>
<button class="checkout" id="co" disabled>Place order</button>
<div id="msg"></div>
</aside>
</div>
<script>
const MENU=[
{id:1,n:"Paneer Butter Masala",c:"Mains",p:240,e:"🍛",d:"Creamy tomato gravy with soft paneer cubes."},
{id:2,n:"Chicken Biryani",c:"Mains",p:280,e:"🍗",d:"Fragrant basmati layered with spiced chicken."},
{id:3,n:"Veg Thali",c:"Mains",p:200,e:"🍱",d:"Dal, sabzi, rice, roti and a sweet."},
{id:4,n:"Margherita Pizza",c:"Mains",p:220,e:"🍕",d:"Mozzarella, basil and house tomato sauce."},
{id:5,n:"Samosa (2 pcs)",c:"Starters",p:50,e:"🥟",d:"Crispy pastry stuffed with spiced potato."},
{id:6,n:"Paneer Tikka",c:"Starters",p:190,e:"🍢",d:"Char-grilled paneer with mint chutney."},
{id:7,n:"Spring Rolls",c:"Starters",p:120,e:"🌯",d:"Crunchy vegetable rolls with sweet chilli dip."},
{id:8,n:"Butter Naan",c:"Breads",p:40,e:"🫓",d:"Soft tandoor-baked bread brushed with butter."},
{id:9,n:"Garlic Naan",c:"Breads",p:50,e:"🫓",d:"Naan topped with garlic and coriander."},
{id:10,n:"Gulab Jamun (2 pcs)",c:"Desserts",p:70,e:"🍮",d:"Warm milk dumplings in rose syrup."},
{id:11,n:"Chocolate Brownie",c:"Desserts",p:110,e:"🍫",d:"Fudgy brownie with a gooey centre."},
{id:12,n:"Masala Chai",c:"Drinks",p:30,e:"☕",d:"Ginger-cardamom milk tea."},
{id:13,n:"Mango Lassi",c:"Drinks",p:80,e:"🥭",d:"Thick chilled yoghurt and mango drink."},
{id:14,n:"Fresh Lime Soda",c:"Drinks",p:60,e:"🍋",d:"Sweet, salted or mixed."}
];
const TAX=0.05, DELIVERY=30, FREE_OVER=500;
const cart={};let cat="All";
const inr=n=>"₹"+n.toFixed(2);
const $=id=>document.getElementById(id);

function chips(){
  const cats=["All",...new Set(MENU.map(m=>m.c))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("");
}
function menu(){
  $("menu").innerHTML=MENU.filter(m=>cat==="All"||m.c===cat).map(m=>`
  <div class="card"><div class="emoji">${m.e}</div><h3>${m.n}</h3><p>${m.d}</p>
  <div class="row"><span class="price sans">${inr(m.p)}</span><button class="add" data-a="${m.id}">Add</button></div></div>`).join("");
}
function render(){
  const ids=Object.keys(cart);
  const count=ids.reduce((s,i)=>s+cart[i],0);
  $("count").textContent=count;
  if(!ids.length){
    $("cart").innerHTML='<div class="empty">Your cart is empty.<br>Add something tasty!</div>';
    $("sum").innerHTML="";$("co").disabled=true;return;
  }
  let sub=0;
  $("cart").innerHTML=ids.map(i=>{
    const m=MENU.find(x=>x.id==i),q=cart[i],line=m.p*q;sub+=line;
    return `<div class="item sans"><div><strong>${m.n}</strong><small>${inr(m.p)} each</small>
    <div class="qty"><button data-m="${i}">−</button><span>${q}</span><button data-p="${i}">+</button>
    <button class="rm" style="width:auto;border:0;background:none" data-r="${i}">Remove</button></div></div>
    <strong>${inr(line)}</strong></div>`;
  }).join("");
  const tax=sub*TAX, del=sub>=FREE_OVER?0:DELIVERY, total=sub+tax+del;
  $("sum").innerHTML=`<div><span>Subtotal</span><span>${inr(sub)}</span></div>
  <div><span>GST (5%)</span><span>${inr(tax)}</span></div>
  <div><span>Delivery${del===0?" (free over ₹"+FREE_OVER+")":""}</span><span>${inr(del)}</span></div>
  <div class="total"><span>Total</span><span>${inr(total)}</span></div>`;
  $("co").disabled=false;
  $("co").dataset.total=total;
}
document.addEventListener("click",e=>{
  const t=e.target,d=t.dataset;
  if(d.c){cat=d.c;chips();menu();}
  else if(d.a){cart[d.a]=(cart[d.a]||0)+1;$("msg").innerHTML="";render();}
  else if(d.p){cart[d.p]++;render();}
  else if(d.m){if(--cart[d.m]<=0)delete cart[d.m];render();}
  else if(d.r){delete cart[d.r];render();}
});
$("co").onclick=()=>{
  const total=Number($("co").dataset.total);
  for(const k in cart)delete cart[k];
  render();
  $("msg").innerHTML=`<div class="ok sans">✅ Order placed! Total paid: <strong>${inr(total)}</strong>.<br>Estimated delivery: 35 minutes.</div>`;
};
chips();menu();render();
</script>
</body>
</html>
